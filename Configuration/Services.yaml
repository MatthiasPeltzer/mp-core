services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  Mpc\MpCore\:
    resource: '../Classes/*'
    exclude: '../Classes/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

  Mpc\MpCore\UserFunc\ColorPickerValueItems:
    public: true

  Mpc\MpCore\Command\ImportDocumentationCommand:
    tags:
      - name: console.command
        command: 'docsite:import'
        description: 'Import docs-site HTML fragments into TYPO3 pages.'
        schedulable: false

