services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  Mpc\MpCore\ViewHelpers\:
    resource: '../Classes/ViewHelpers/*'
    public: true

  Mpc\MpCore\:
    resource: '../Classes/*'
    exclude: '../Classes/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

  Mpc\MpCore\UserFunc\ColorPickerValueItems:
    public: true

  Mpc\MpCore\EventListener\RegisterIconsEventListener:
    tags:
      - name: event.listener
        identifier: 'mpc/mp-core/register-icons'
        event: TYPO3\CMS\Core\Core\Event\BootCompletedEvent
