imports:
  # Optional local-only DI registrations (e.g. tooling commands that are
  # gitignored). Missing file must not break container compilation.
  - { resource: 'Services.local.yaml', ignore_errors: not_found }

services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  Mpc\MpCore\:
    resource: '../Classes/*'
    exclude: '../Classes/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

  # Dedicated cache frontend for the /robots.txt and /llms.txt middleware.
  cache.mp_core_geotext:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['mp_core_geotext']

  Mpc\MpCore\Middleware\RobotsTxtMiddleware:
    arguments:
      $cache: '@cache.mp_core_geotext'

  Mpc\MpCore\Middleware\LlmsTxtMiddleware:
    arguments:
      $cache: '@cache.mp_core_geotext'

  # TYPO3 core does not register this class; required for frontend query restrictions.
  TYPO3\CMS\Core\Database\Query\Restriction\FrontendRestrictionContainer:
    shared: false

  # DataProcessors are instantiated by TypoScript via GeneralUtility::makeInstance()
  # and therefore must be resolvable as public services from the container.
  Mpc\MpCore\DataProcessing\HeaderLogoProcessor:
    public: true

  Mpc\MpCore\DataProcessing\SocialMediaProcessor:
    public: true

  Mpc\MpCore\DataProcessing\StructuredDataProcessor:
    public: true

  Mpc\MpCore\DataProcessing\WebFontProcessor:
    public: true

  Mpc\MpCore\UserFunc\ColorPickerValueItems:
    public: true

  # Resolved via TCA ctrl.previewRenderer and GeneralUtility::makeInstance().
  Mpc\MpCore\Preview\CustomContentPreviewRenderer:
    public: true
