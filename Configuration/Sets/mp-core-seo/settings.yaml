# SEO Extension Settings
seo.meta.defaultDescription: ''
seo.meta.generateDescriptions: true
seo.meta.maxDescriptionLength: 160
seo.meta.maxTitleLength: 60
seo.meta.titleSeparator: ' | '

seo.openGraph.enabled: true
seo.openGraph.defaultImage: ''
seo.openGraph.imageWidth: 1200
seo.openGraph.imageHeight: 630

seo.twitter.enabled: true
seo.twitter.cardType: 'summary_large_image'
seo.twitter.site: ''

seo.sitemap.enabled: true
seo.sitemap.excludeHiddenPages: true
seo.sitemap.priority: '0.5'

seo.canonical.enabled: true

seo.schema.enabled: true
seo.schema.organizationType: 'Organization'
seo.schema.legalName: ''
seo.schema.alternateName: ''
seo.schema.description: ''
seo.schema.foundingDate: ''
seo.schema.vatId: ''
seo.schema.taxId: ''
seo.schema.knowsAbout: ''
seo.schema.person.jobTitle: ''
seo.schema.email: ''
seo.schema.telephone: ''
seo.schema.contactPoint.contactType: 'customer service'
seo.schema.contactPoint.telephone: ''
seo.schema.contactPoint.email: ''
seo.schema.contactPoint.areaServed: ''
seo.schema.contactPoint.availableLanguage: ''
seo.schema.address.streetAddress: ''
seo.schema.address.addressLocality: ''
seo.schema.address.postalCode: ''
seo.schema.address.addressRegion: ''
seo.schema.address.addressCountry: ''

seo.robots.enabled: true
seo.robots.allowAiBots: true
seo.robots.crawlDelay: 0
seo.robots.additional: ''

seo.llmsTxt.enabled: true
seo.llmsTxt.intro: ''
