# Load default processing options
imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

editor:
  config:
    contentsCss:
      - "EXT:mp_core/Resources/Public/StyleSheets/ckeditor.css"
    debug: false
    allowedContent: true
    defaultContentLanguage: "de"

    importModules:
      - { module: '@ckeditor/ckeditor5-word-count', exports: [ 'WordCount' ] }
      - { module: '@ckeditor/ckeditor5-language', exports: [ 'TextPartLanguage' ] }
      # List Properties - enables advanced list options (styles, start index, reversed)
      - { module: '@ckeditor/ckeditor5-list', exports: [ 'ListProperties' ] }
      # Style plugin for custom text/block styles
      - { module: '@ckeditor/ckeditor5-style', exports: [ 'Style' ] }
      # Definition List Plugin
      - { module: '@mpc/mp-core/ckeditor/definition-list.js', exports: [ 'DefinitionList' ] }

    heading:
      options:
        - { model: 'paragraph', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.paragraph' }
        - { model: 'heading1', view: 'h1', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h1' }
        - { model: 'heading2', view: 'h2', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h2' }
        - { model: 'heading3', view: 'h3', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h3' }
        - { model: 'heading4', view: 'h4', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h4' }
        - { model: 'heading5', view: 'h5', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h5' }
        - { model: 'heading6', view: 'h6', title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:heading.h6' }

    style:
      definitions:
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.paragraph.kicker', element: 'p', classes: [ 'kicker' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.paragraph.subheader', element: 'p', classes: [ 'lead' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.blockquote.quote', element: 'blockquote', classes: [ 'quote-dot' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.button.primary', element: 'a', classes: [ 'btn', 'btn-primary' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.button.secondary', element: 'a', classes: [ 'btn', 'btn-secondary' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.button.tertiary', element: 'a', classes: [ 'btn', 'btn-tertiary' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.list.unstyled', element: 'ul', classes: [ 'list-unstyled' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.list.scroll', element: 'ul', classes: [ 'list-scroll' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h2_to_h1', element: 'h2', classes: [ 'h1' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h2_to_h3', element: 'h2', classes: [ 'h3' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h2_to_h4', element: 'h2', classes: [ 'h4' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h2_to_h5', element: 'h2', classes: [ 'h5' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h2_to_h6', element: 'h2', classes: [ 'h6' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h3_to_h1', element: 'h3', classes: [ 'h1' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h3_to_h2', element: 'h3', classes: [ 'h2' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h3_to_h4', element: 'h3', classes: [ 'h4' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h3_to_h5', element: 'h3', classes: [ 'h5' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h3_to_h6', element: 'h3', classes: [ 'h6' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h4_to_h1', element: 'h4', classes: [ 'h1' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h4_to_h2', element: 'h4', classes: [ 'h2' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h4_to_h3', element: 'h4', classes: [ 'h3' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h4_to_h5', element: 'h4', classes: [ 'h5' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h4_to_h6', element: 'h4', classes: [ 'h6' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h5_to_h1', element: 'h5', classes: [ 'h1' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h5_to_h2', element: 'h5', classes: [ 'h2' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h5_to_h3', element: 'h5', classes: [ 'h3' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h5_to_h4', element: 'h5', classes: [ 'h4' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h5_to_h6', element: 'h5', classes: [ 'h6' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h6_to_h1', element: 'h6', classes: [ 'h1' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h6_to_h2', element: 'h6', classes: [ 'h2' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h6_to_h3', element: 'h6', classes: [ 'h3' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h6_to_h4', element: 'h6', classes: [ 'h4' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.headline.h6_to_h5', element: 'h6', classes: [ 'h5' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.internal', element: 'a', classes: [ 'internal-link' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.external', element: 'a', classes: [ 'external-link' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.download', element: 'a', classes: [ 'download' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.email', element: 'a', classes: [ 'email' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.phone', element: 'a', classes: [ 'phone' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.audio', element: 'a', classes: [ 'audio' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.video', element: 'a', classes: [ 'video' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.glossary', element: 'a', classes: [ 'glossary' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.public', element: 'a', classes: [ 'public' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.legal', element: 'a', classes: [ 'legal' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.gallery', element: 'a', classes: [ 'gallery' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.link.chart', element: 'a', classes: [ 'chart' ] }

        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.lowercase', element: 'span', classes: [ 'text-lowercase' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.uppercase', element: 'span', classes: [ 'text-uppercase' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.capitalize', element: 'span', classes: [ 'text-capitalize' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.bold', element: 'span', classes: [ 'bold' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.small', element: 'span', classes: [ 'small' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.emphasize', element: 'span', classes: [ 'em' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.nowrap', element: 'span', classes: [ 'text-nowrap' ] }
        - { name: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:style.text.hidden', element: 'span', classes: [ 'hide', 'visually-hidden' ] }

    toolbar:
      items:
        - heading
        - style
        - '|'
        - textPartLanguage
        - '|'
        - bold
        - italic
        - link
        - bulletedList
        - numberedList
        - definitionList
        - '|'
        - outdent
        - indent
        - '|'
        - blockQuote
        - alignment
        - '|'
        - undo
        - redo
        - removeFormat
        - '|'
        - insertTable
        - '|'
        - superscript
        - subscript
        - strikeThrough
        - horizontalLine
        - '|'
        - specialCharacters
        - sourceEditing
        - findAndReplace
        - showBlocks

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption

      tableCaption: {
        useCaptionElement: true
      }

    # List Properties - enables style selection, start index, and reversed order
    list:
      properties:
        styles: true
        startIndex: true
        reversed: true

    # Definition List Plugin - labels for translation
    definitionList:
      labels:
        title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:definitionList.title'
        insert: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:definitionList.insert'
        addTerm: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:definitionList.addTerm'
        addDescription: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:definitionList.addDescription'
        remove: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:definitionList.remove'

    # Language options for textPartLanguage
    language:
      textPartLanguage:
        - { title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:language.german', languageCode: 'de' }
        - { title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:language.english', languageCode: 'en' }
        - { title: 'LLL:EXT:mp_core/Resources/Private/Language/locallang_rte.xlf:language.french', languageCode: 'fr' }

    processing:
      allow_tags:
        - s
        - figure
        - figcaption
        - i
        - em
        - dl
        - dt
        - dd

    # Allow definition list HTML elements through General HTML Support
    htmlSupport:
      allow:
        - { name: 'dl', classes: true }
        - { name: 'dt', classes: true }
        - { name: 'dd', classes: true }
        # Allow classes on list elements (ul, ol, li)
        - { name: 'ul', classes: true }
        - { name: 'ol', classes: true }
        - { name: 'li', classes: true }
        # Allow classes on headings for style variations
        - { name: 'h2', classes: true }
        - { name: 'h3', classes: true }
        - { name: 'h4', classes: true }
        - { name: 'h5', classes: true }
        - { name: 'h6', classes: true }

buttons:
  link:
    properties:
      class:
        allowedClasses: 'internal-link, external-link, download, email, phone, audio, video, glossary, public, legal, gallery, chart'
