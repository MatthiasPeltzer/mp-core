<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="tx-indexedsearch-searchbox">
  <f:form action="search" method="post" id="tx_indexedsearch" pageUid="{settings.targetPid}">
    <div class="tx-indexedsearch-hidden-fields">
      <f:form.hidden name="search[_sections]" value="0" />
      <f:form.hidden name="search[_freeIndexUid]" id="tx_indexedsearch_freeIndexUid" value="_" />
      <f:form.hidden name="search[pointer]" id="tx_indexedsearch_pointer" value="0" />
      <f:form.hidden name="search[ext]" value="{searchParams.ext}" />
      <f:form.hidden name="search[searchType]" value="{searchParams.searchType}" />
      <f:form.hidden name="search[defaultOperand]" value="{searchParams.defaultOperand}" />
      <f:form.hidden name="search[mediaType]" value="{searchParams.mediaType}" />
      <f:form.hidden name="search[group]" value="{searchParams.group}" />
      <f:form.hidden name="search[numberOfResults]" value="{searchParams.numberOfResults}" />
      <f:form.hidden name="search[extendedSearch]" value="1" />
    </div>
    <fieldset>
      <legend class="visually-hidden"><f:translate key="form.legend" /></legend>

      <div class="mb-3">
        <label class="form-label fw-bold" for="tx-indexedsearch-searchbox-sword">
          <f:translate key="form.searchFor" />:</label>
        <div class="input-group">
          <f:form.textfield name="search[sword]" value="{sword}" id="tx-indexedsearch-searchbox-sword" class="form-control tx-indexedsearch-searchbox-sword" />
          <f:form.submit name="search[submitButton]" value="{f:translate(key: 'form.submit')}" id="tx-indexedsearch-searchbox-button-submit" class="btn btn-primary tx-indexedsearch-searchbox-button" />
        </div>
      </div>

      <f:if condition="{allSortDescendings}">
        <div class="row mb-3 justify-content-end">
          <div class="col-md-4">
            <label class="form-label" for="tx-indexedsearch-selectbox-desc">
              <f:translate key="form.orderBy" />:</label>
            <f:form.select name="search[sortDesc]" options="{allSortDescendings}" value="{searchParams.sortDesc}" id="tx-indexedsearch-selectbox-desc" class="form-select" />
          </div>
        </div>
      </f:if>

      <f:if condition="{settings.displayAdvancedSearchLink}">
        <p class="mb-2 tx-indexedsearch-advanced-search-button">
          <a class="btn btn-primary" data-bs-toggle="collapse" href="#tx-indexedsearch-advanced" role="button" aria-expanded="false" aria-controls="tx-indexedsearch-advanced">
            <f:translate key="form.linkToAdvancedSearch" />
          </a>
        </p>

        <div class="collapse" id="tx-indexedsearch-advanced">
          <div class="card">
            <div class="card-body">
              <f:if condition="{showSortOrders}">
                <div class="mb-3">
                  <label class="form-label" for="tx-indexedsearch-selectbox-order">
                    <f:translate key="form.orderBy" />:</label>
                  <f:form.select name="search[sortOrder]" options="{allSortOrders}" value="{searchParams.sortOrder}" id="tx-indexedsearch-selectbox-order" class="form-select" />
                </div>
              </f:if>

              <div class="row mb-3">
                <f:if condition="{showTypeSearch}">
                    <f:if condition="{allSearchTypes}">
                      <div class="col-md-6 mb-3">
                        <label class="form-label" for="tx-indexedsearch-selectbox-searchtype">
                          <f:translate key="form.match" />:</label>
                        <f:form.select name="search[searchType]" options="{allSearchTypes}" value="{searchParams.searchType}" id="tx-indexedsearch-selectbox-searchtype" class="form-select" />
                      </div>
                    </f:if>
                    <f:if condition="{allDefaultOperands}">
                      <div class="col-md-6 mb-3">
                        <label class="form-label" for="tx-indexedsearch-selectbox-defaultoperand">&nbsp;</label>
                        <f:form.select name="search[defaultOperand]" options="{allDefaultOperands}" value="{searchParams.defaultOperand}" id="tx-indexedsearch-selectbox-defaultoperand" class="form-select" />
                      </div>
                    </f:if>
                </f:if>
                <f:if condition="{allMediaTypes}">
                  <div class="col-md-4 mb-3">
                    <label class="form-label" for="tx-indexedsearch-selectbox-media">
                      <f:translate key="form.searchIn" />:</label>
                    <f:form.select name="search[mediaType]" options="{allMediaTypes}" value="{searchParams.mediaType}" id="tx-indexedsearch-selectbox-media" class="form-select" />
                  </div>
                </f:if>
                <f:if condition="{allSections}">
                  <div class="col-md-4 mb-3">
                    <label class="form-label" for="tx-indexedsearch-selectbox-sections">
                      <f:translate key="form.fromSection" />:</label>
                    <f:form.select name="search[sections]" options="{allSections}" value="{searchParams.sections}" id="tx-indexedsearch-selectbox-sections" class="form-select" />
                  </div>
                </f:if>
                <f:if condition="{allIndexConfigurations}">
                  <div class="col-md-4 mb-3">
                    <label class="form-label" for="tx-indexedsearch-selectbox-freeIndexUid">
                      <f:translate key="form.freeIndexUid" />:</label>
                    <f:form.select name="search[freeIndexUid]" options="{allIndexConfigurations}" value="{searchParams.freeIndexUid}" id="tx-indexedsearch-selectbox-freeIndexUid" class="form-select" />
                  </div>
                </f:if>
              </div>
              <div class="row mb-3">
                <f:if condition="{allNumberOfResults}">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="tx-indexedsearch-selectbox-results">
                      <f:translate key="form.atATime" /></label>
                    <f:form.select name="search[numberOfResults]" options="{allNumberOfResults}" value="{searchParams.numberOfResults}" id="tx-indexedsearch-selectbox-results" class="form-select" />
                  </div>
                </f:if>
                <f:if condition="{allGroups}">
                  <div class="col-md-6 mb-3">
                    <label class="form-label" for="tx-indexedsearch-selectbox-group">
                      <f:translate key="form.style" />:</label>
                    <f:form.select name="search[group]" options="{allGroups}" value="{searchParams.group}" id="tx-indexedsearch-selectbox-group" class="form-select" />
                  </div>
                </f:if>
              </div>

              <div class="d-grid">
                <f:form.submit name="search[submitButton]" value="{f:translate(key: 'form.submit')}" class="btn btn-primary mb-5 tx-indexedsearch-searchbox-button" />
              </div>
            </div>
          </div>
        </div>
      </f:if>
    </fieldset>
  </f:form>
</div>
</html>
