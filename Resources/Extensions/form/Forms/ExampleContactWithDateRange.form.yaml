
identifier: example-contact-date-range
type: Form
label: 'Beispiel: Kontakt mit Reisezeitraum'
prototypeName: standard
renderingOptions:
  submitButtonLabel: Absenden
finishers:
  -
    options:
      subject: 'Anfrage {example-contact-date-range}: {subject}'
      title: 'Neue Kontaktanfrage'
      templateName: ContactReceiver
      senderAddress: noreply@example.com
      senderName: 'Website contact form'
      recipients:
        mail@example.com: Example
      addHtmlPart: true
      replyToRecipients:
        '{email}': '{name}'
    identifier: EmailToReceiver
  -
    options:
      subject: 'Ihre Nachricht'
      title: Eingangsbestätigung
      templateName: ContactSender
      senderAddress: noreply@example.com
      senderName: 'Website contact form'
      recipients:
        '{email}': '{name}'
      addHtmlPart: true
    identifier: EmailToSender
  -
    options:
      message: '<p>Vielen Dank. Wir haben Ihre Nachricht erhalten.</p>'
    identifier: Confirmation
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'Previous step'
      nextButtonLabel: 'Next step'
    identifier: page-1
    label: Kontakt
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: name
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: E-Mail
        type: Email
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: email
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
      -
        defaultValue: ''
        identifier: subject
        label: Betreff
        type: Text
        properties:
          fluidAdditionalAttributes:
            required: required
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue:
          start: ''
          end: ''
        properties:
          startLabel: Von
          endLabel: Bis
          bootstrapDateMin: '2026-11-24'
          bootstrapDateMax: '2026-12-24'
          fluidAdditionalAttributes:
            required: required
        type: DateFromTo
        identifier: datefromto-1
        label: 'Reisezeitraum (zwei Felder)'
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        properties:
          bootstrapDisplayMonthsCount: '2'
          fluidAdditionalAttributes:
            required: required
          bootstrapDateMin: '2026-11-24'
          bootstrapDateMax: '2026-12-24'
        identifier: travel-dates
        label: 'Reisezeitraum (ein Feld)'
        type: DateRange
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: message
        label: Nachricht
        type: Textarea
        properties:
          fluidAdditionalAttributes:
            required: required
            rows: 5
        validators:
          -
            identifier: NotEmpty
  -
    renderingOptions:
      previousButtonLabel: 'Previous step'
      nextButtonLabel: 'Next step'
    identifier: summary
    label: Zusammenfassung
    type: SummaryPage
variants: {  }
