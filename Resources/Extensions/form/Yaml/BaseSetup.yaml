TYPO3:
  CMS:
    Form:
      persistenceManager:
        allowedFileMounts:
          10: '1:/form_definitions/'
          20: '2:/formupload/'
        allowedExtensionPaths:
          10: 'EXT:mp_core/Resources/Extensions/form/Forms/'
        allowSaveToExtensionPaths: true
        allowDeleteFromExtensionPaths: true
      prototypes:
        standard:
          formEditor:
            translationFiles:
              20: 'EXT:mp_core/Resources/Private/Language/locallang_form_fieldset.xlf'
              30: 'EXT:mp_core/Resources/Private/Language/locallang_form_bs6.xlf'
          formElementsDefinition:
            FileUpload:
              formEditor:
                predefinedDefaults:
                  properties:
                    saveToFileMount: '2:/formupload/'
                editors:
                  400:
                    selectOptions:
                      10:
                        value: '2:/formupload/'
                        label: '2:/formupload/'
              properties:
                saveToFileMount: '2:/formupload/'
            Textarea:
              properties:
                rows: 10
                maxlength: 2000
            ImageUpload:
              formEditor:
                predefinedDefaults:
                  properties:
                    saveToFileMount: '2:/formupload/'
                editors:
                  400:
                    selectOptions:
                      10:
                        value: '2:/formupload/'
                        label: '2:/formupload/'
            Fieldset:
              formEditor:
                editors:
                  210:
                    identifier: sectionHeadingLevel
                    templateName: Inspector-SingleSelectEditor
                    label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.label
                    propertyPath: properties.sectionHeadingLevel
                    selectOptions:
                      10:
                        value: ''
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.legend
                      20:
                        value: h2
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h2
                      30:
                        value: h3
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h3
                      40:
                        value: h4
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h4
                  220:
                    identifier: sectionSubheader
                    templateName: Inspector-TextEditor
                    label: formEditor.elements.Fieldset.editor.sectionSubheader.label
                    propertyPath: properties.sectionSubheader
                    description: formEditor.elements.Fieldset.editor.sectionSubheader.description
                predefinedDefaults:
                  properties:
                    sectionHeadingLevel: ''
                    sectionSubheader: ''
              properties:
                sectionHeadingLevel: ''
                sectionSubheader: ''
            Date:
              formEditor:
                editors:
                  320:
                    identifier: enableBootstrapDatepicker
                    templateName: Inspector-CheckboxEditor
                    label: formEditor.elements.Date.editor.enableBootstrapDatepicker.label
                    propertyPath: properties.enableBootstrapDatepicker
                    description: formEditor.elements.Date.editor.enableBootstrapDatepicker.description
                  325:
                    identifier: bootstrapDateMin
                    templateName: Inspector-TextEditor
                    label: formEditor.elements.Date.editor.bootstrapDateMin.label
                    propertyPath: properties.bootstrapDateMin
                    description: formEditor.elements.Date.editor.bootstrapDateMin.description
                    doNotSetIfPropertyValueIsEmpty: true
                  326:
                    identifier: bootstrapDateMax
                    templateName: Inspector-TextEditor
                    label: formEditor.elements.Date.editor.bootstrapDateMax.label
                    propertyPath: properties.bootstrapDateMax
                    description: formEditor.elements.Date.editor.bootstrapDateMax.description
                    doNotSetIfPropertyValueIsEmpty: true
                predefinedDefaults:
                  properties:
                    enableBootstrapDatepicker: false
                    bootstrapDateMin: ''
                    bootstrapDateMax: ''
              properties:
                enableBootstrapDatepicker: false
                bootstrapDateMin: ''
                bootstrapDateMax: ''
            MultiSelect:
              formEditor:
                editors:
                  320:
                    identifier: useBootstrapCombobox
                    templateName: Inspector-CheckboxEditor
                    label: formEditor.elements.MultiSelect.editor.useBootstrapCombobox.label
                    propertyPath: properties.useBootstrapCombobox
                    description: formEditor.elements.MultiSelect.editor.useBootstrapCombobox.description
                predefinedDefaults:
                  properties:
                    useBootstrapCombobox: false
              properties:
                useBootstrapCombobox: false
            Form:
              renderingOptions:
                templateVariant: version2
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
          finishersDefinition:
            EmailToReceiver:
              implementationClassName: Mpc\MpCore\Domain\Finishers\BrandedEmailFinisher
              options:
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/Finishers/Email/'
            EmailToSender:
              implementationClassName: Mpc\MpCore\Domain\Finishers\BrandedEmailFinisher
              options:
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/Finishers/Email/'
