TYPO3:
  CMS:
    Form:
      persistenceManager:
        allowedFileMounts:
          10: '1:/form_definitions/'
          20: '2:/formupload/'
        allowedExtensionPaths:
          10: 'EXT:mp_core/Resources/Extensions/form/Forms/'
        allowSaveToExtensionPaths: true
        allowDeleteFromExtensionPaths: true
      prototypes:
        standard:
          formEditor:
            translationFiles:
              20: 'EXT:mp_core/Resources/Private/Language/locallang_form_fieldset.xlf'
          formElementsDefinition:
            FileUpload:
              formEditor:
                predefinedDefaults:
                  properties:
                    saveToFileMount: '2:/formupload/'
                editors:
                  400:
                    selectOptions:
                      10:
                        value: '2:/formupload/'
                        label: '2:/formupload/'
              properties:
                saveToFileMount: '2:/formupload/'
            Textarea:
              properties:
                rows: 10
                maxlength: 2000
            ImageUpload:
              formEditor:
                predefinedDefaults:
                  properties:
                    saveToFileMount: '2:/formupload/'
                editors:
                  400:
                    selectOptions:
                      10:
                        value: '2:/formupload/'
                        label: '2:/formupload/'
            Fieldset:
              formEditor:
                editors:
                  210:
                    identifier: sectionHeadingLevel
                    templateName: Inspector-SingleSelectEditor
                    label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.label
                    propertyPath: properties.sectionHeadingLevel
                    selectOptions:
                      10:
                        value: ''
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.legend
                      20:
                        value: h2
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h2
                      30:
                        value: h3
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h3
                      40:
                        value: h4
                        label: formEditor.elements.Fieldset.editor.sectionHeadingLevel.h4
                  220:
                    identifier: sectionSubheader
                    templateName: Inspector-TextEditor
                    label: formEditor.elements.Fieldset.editor.sectionSubheader.label
                    propertyPath: properties.sectionSubheader
                    description: formEditor.elements.Fieldset.editor.sectionSubheader.description
                predefinedDefaults:
                  properties:
                    sectionHeadingLevel: ''
                    sectionSubheader: ''
              properties:
                sectionHeadingLevel: ''
                sectionSubheader: ''
            Form:
              renderingOptions:
                templateVariant: version2
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
          finishersDefinition:
            EmailToReceiver:
              implementationClassName: Mpc\MpCore\Domain\Finishers\BrandedEmailFinisher
              options:
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/Finishers/Email/'
            EmailToSender:
              implementationClassName: Mpc\MpCore\Domain\Finishers\BrandedEmailFinisher
              options:
                layoutRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Layouts/'
                partialRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Partials/'
                templateRootPaths:
                  200: 'EXT:mp_core/Resources/Extensions/form/Frontend/Templates/Finishers/Email/'
