<html data-namespace-typo3-fluid="true" lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:mpc="http://typo3.org/ns/Mpc/MpCore/ViewHelpers"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<f:comment><!--
    Arguments:
        logoFile    string  `t3://file?uid=N` link string from the
                            SiteConfiguration `type=link/allowedTypes=['file']`
                            field, *not* a sys_file_reference UID.
                            `ImageService::getImage()` detects the `t3://file`
                            prefix and resolves it via `LinkService`, so no
                            `treatIdAsReference` is needed (and would be
                            misleading here).
        preferSvg   bool    If true, the file is inlined via `mpc:svgInline`
                            (requires the file to actually be an SVG, else the
                            ViewHelper throws). If false, the file is rendered
                            via `<f:image>` (raster output, served at the size
                            requested via `maxHeight`).
        imageClass  string  Class applied to the inlined SVG / `<img>`. The
                            CSS visual size cap lives on the surrounding
                            wrapper (`.header-image`, `.header-image-small`,
                            `.header-bg-svg`), not on this class.
        maxHeight   int     Optional. Server-side height cap passed to
                            `<f:image>`. Pick ~2× the largest CSS display
                            height for HiDPI sharpness (e.g. 500 for the big
                            logo capped to 250px, 96 for the small/sticky
                            logo capped to 48px, 920 for the .bg-svg
                            background). Defaults to 500 so the partial does
                            something reasonable for sites that don't pass it.
--></f:comment>
<f:variable name="resolvedMaxHeight">{f:if(condition: maxHeight, then: maxHeight, else: 400)}</f:variable>
<f:if condition="{logoFile}">
    <f:then>
        <f:if condition="{preferSvg}">
            <f:then><mpc:svgInline src="{logoFile}" class="{imageClass}" additionalAttributes="{aria-hidden:'true'}"/></f:then>
            <f:else><f:image src="{logoFile}" maxHeight="{resolvedMaxHeight}" /></f:else>
        </f:if>
    </f:then>
    <f:else>
      <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1024 1024" width="48" height="48" aria-hidden="true">
        <g>
          <path fill="#81a998" fill-opacity="0.8" d="M961.7,527.7l-238.4,381.6-449.8-15.7L62.3,496.3,300.7,114.7l449.8,15.7,211.2,397.3ZM869.8,524.5l-168.1-316.1-357.8-12.5-189.7,303.6,168.1,316.1,357.8,12.5,189.7-303.6Z"/>
          <path fill="#155742" fill-opacity="0.8" d="M940,651.1l-334.4,301.1-428-139.1-93.6-440.2L418.4,71.8l428,139.1,93.6,440.2ZM852.5,622.6l-74.5-350.1-340.4-110.7-266.1,239.6,74.5,350.1,340.4,110.7,266.1-239.6Z"/>
          <path fill="#81a998" fill-opacity="0.8" d="M733.9,519.7l-117.7,188.3-221.8-7.7-104.3-196,117.7-188.3,221.8,7.7,104.3,196ZM690.9,518.2l-84-158-178.9-6.2-94.9,151.8,84,158,178.9,6.2,94.9-151.8Z"/>
          <path fill="#155742" fill-opacity="0.8" d="M723.1,580.6l-164.9,148.5-211.2-68.6-46.1-217.1,164.9-148.5,211.2,68.6,46.1,217.1ZM682.2,567.3l-37.2-175.1-170.2-55.3-133,119.8,37.2,175.1,170.2,55.3,133-119.8Z"/>
        </g>
      </svg>
    </f:else>
</f:if>

</html>
