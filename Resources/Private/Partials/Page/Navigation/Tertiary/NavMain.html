<html data-namespace-typo3-fluid="true" lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:mpc="http://typo3.org/ns/Mpc/MpCore/ViewHelpers"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<li class="mainnav-desktop-item{f:if(condition:'{mainItem.data.doktype} == 4', then:' shortcut')}">
      <f:if condition="{mainItem.children}">
          <f:then>
              <f:if condition="{mainItem.children}">
                  <f:render partial="Navigation/NavMenuLink" arguments="{item: mainItem, current: mainItem.current, linkClass: 'first-nav{f:if(condition:mainItem.active, then:\' act\')}{f:if(condition:mainItem.current, then:\' current\')}{f:if(condition:mainItem.hasSubpages, then:\' hassub\')}'}" />
                  <button aria-controls="menu-desktop-{mainItem.data.uid}" aria-expanded="false" class="first-nav-button {f:if(condition:mainItem.active, then:' act')}{f:if(condition:mainItem.current, then:' current')}{f:if(condition:mainItem.hasSubpages, then:' hassub')}" data-bs-auto-close="outside" data-bs-boundary="scrollParent" data-bs-display="static" data-bs-reference="parent" data-bs-toggle="dropdown" type="button" aria-label="{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                          <title>{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}</title>
                          <path d="M3.204 5h9.592L8 10.481zm-.753.659 4.796 5.48a1 1 0 0 0 1.506 0l4.796-5.48c.566-.647.106-1.659-.753-1.659H3.204a1 1 0 0 0-.753 1.659"/>
                      </svg>
                  </button>
                  <div class="dropdown-menu main-menu-desktop" id="menu-desktop-{mainItem.data.uid}">
                      <ul class="container list-unstyled mainnav-children">
                          <f:for as="mainChild" each="{mainItem.children}">
                              <f:render partial="Navigation/Tertiary/NavMainSubmenuItem" arguments="{mainChild: mainChild, variant: 'desktop', parentMenuId: 'menu-desktop-{mainItem.data.uid}'}" />
                          </f:for>
                      </ul>
                  </div>
              </f:if>
          </f:then>
          <f:else>
              <f:render partial="Navigation/NavMenuLink" arguments="{item: mainItem, current: mainItem.current, linkClass: 'first-nav{f:if(condition:mainItem.active, then:\' act\')}{f:if(condition:mainItem.current, then:\' current\')}{f:if(condition:mainItem.hasSubpages, then:\' hassub\')}'}" />
          </f:else>
    </f:if>
</li>

</html>
