<html data-namespace-typo3-fluid="true" lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<f:variable name="submenuLinkClass" value="sub{f:if(condition: '{variant} == \'desktop\'', then: ' collapsed')} dropdown-item{f:if(condition: mainChild.active, then:' act')}{f:if(condition: mainChild.current, then:' current')}{f:if(condition: mainChild.hasSubpages, then:' hassub')}" />

<f:if condition="{mainChild.children}">
    <f:then>
        <li{f:if(condition: '{mainChild.data.doktype} == 4', then: ' class="shortcut"')}>
            <f:if condition="{variant} == 'desktop'">
                <f:render partial="Navigation/NavMenuLink" arguments="{item: mainChild, current: mainChild.current, linkClass: submenuLinkClass, wrapInSpan: 1}" />
            </f:if>
            <f:if condition="{variant} == 'mobile'">
                <f:render partial="Navigation/NavMenuLink" arguments="{item: mainChild, current: mainChild.current, linkClass: submenuLinkClass}" />
            </f:if>
            <button
                aria-controls="{f:if(condition: '{variant} == \'desktop\'', then: 'menu-desktop', else: 'menu')}-{mainChild.data.uid}"
                aria-expanded="false"
                aria-label="{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}"
                class="dropdown-item-button{f:if(condition: '{variant} == \'desktop\'', then: ' sub collapsed')} dropdown-item{f:if(condition: mainChild.active, then:' act')}{f:if(condition: mainChild.current, then:' current')}{f:if(condition: mainChild.hasSubpages, then:' hassub')}"
                data-bs-target="#{f:if(condition: '{variant} == \'desktop\'', then: 'menu-desktop', else: 'menu')}-{mainChild.data.uid}"
                data-bs-toggle="collapse"
                type="button">
                <f:if condition="{variant} == 'desktop'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <title>{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}</title>
                        <path d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"/>
                    </svg>
                </f:if>
                <f:if condition="{variant} == 'mobile'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                        <title>{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}</title>
                        <path d="M3.204 5h9.592L8 10.481zm-.753.659 4.796 5.48a1 1 0 0 0 1.506 0l4.796-5.48c.566-.647.106-1.659-.753-1.659H3.204a1 1 0 0 0-.753 1.659"/>
                    </svg>
                </f:if>
            </button>
            <ul
                class="list-unstyled collapse{f:if(condition: '{variant} == \'desktop\'', then: ' subnav-children')}"
                id="{f:if(condition: '{variant} == \'desktop\'', then: 'menu-desktop', else: 'menu')}-{mainChild.data.uid}"
                {f:if(condition: '{variant} == \'desktop\'', then: ' data-bs-parent="#nav-desktop"')}>
                <f:for as="mainChild" each="{mainChild.children}">
                    <f:render partial="Navigation/Tertiary/NavMainSubmenuItem" arguments="{mainChild: mainChild, variant: variant}" />
                </f:for>
            </ul>
        </li>
    </f:then>
    <f:else>
        <li{f:if(condition: '{mainChild.data.doktype} == 4', then: ' class="shortcut"')}>
            <f:if condition="{variant} == 'desktop'">
                <f:render partial="Navigation/NavMenuLink" arguments="{item: mainChild, current: mainChild.current, linkClass: submenuLinkClass, wrapInSpan: 1}" />
            </f:if>
            <f:if condition="{variant} == 'mobile'">
                <f:render partial="Navigation/NavMenuLink" arguments="{item: mainChild, current: mainChild.current, linkClass: submenuLinkClass}" />
            </f:if>
        </li>
    </f:else>
</f:if>

</html>
