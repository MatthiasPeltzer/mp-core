<html data-namespace-typo3-fluid="true" lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<div class="row align-items-center flex-nowrap gx-2 gx-lg-3 nav-secondary-header-bar">
    <f:render arguments="{_all}" partial="Header.Logo"/>
    <div class="col flex-grow-1 min-w-0">
        <div class="d-flex justify-content-end align-items-center gap-2 flex-nowrap">
            <f:render arguments="{_all}" partial="Navigation/Secondary/NavMeta"/>
            <f:render arguments="{_all}" partial="Navigation/Secondary/NavMainMobile"/>
        </div>
    </div>
</div>

<div class="row d-none d-lg-flex">
    <div class="col-12">
        <nav aria-label="{f:translate(key: 'header.mainnavigation', extensionName: 'mp_core')}" class="mainnav-desktop justify-content-end w-100 d-flex flex-wrap">
        <ul class="list-unstyled d-flex mb-0 justify-content-end flex-grow-1" id="nav-desktop">
            <f:for as="mainItem" each="{menuMain}">
                <f:render arguments="{mainItem: mainItem}" partial="Navigation/Secondary/NavMain"/>
            </f:for>

            <f:if condition="{site.settings.search.headerSearch}">
                <li class="mainnav-desktop-item searchbox">
                    <f:render arguments="{_all}" partial="Navigation/Search"/>
                </li>
            </f:if>
        </ul>
        </nav>
    </div>
</div>

</html>
