<html data-namespace-typo3-fluid="true" lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:mpc="http://typo3.org/ns/Mpc/MpCore/ViewHelpers"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:if condition="{menuMain}">
    <div class="main-nav-wrapper" id="main-menu-list">
        <div class="container-md">
            <ul class="main-menu list-unstyled row">
                <f:for as="mainItem" each="{menuMain}">
                    <li class="col{f:if(condition:'{mainItem.data.doktype} == 4', then:' shortcut')}">
                        <f:if condition="{mainItem.children}">
                            <f:then>
                                <f:if condition="{mainItem.children}">
                                    <button aria-controls="menu-{mainItem.data.uid}" aria-expanded="false" class="first-child first-child-btn collapsed dropdown-item{f:if(condition:mainItem.active, then:' act')}{f:if(condition:mainItem.current, then:' current')}{f:if(condition:mainItem.hasSubpages, then:' hassub')}" data-bs-target="#menu-{mainItem.data.uid}" data-bs-toggle="collapse" type="button" title="{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}">{mainItem.title}</button>
                                    <ul class="list-unstyled collapse" id="menu-{mainItem.data.uid}">
                                        <f:for as="mainChild" each="{mainItem.children}">
                                            <f:render arguments="{mainChild: mainChild}" section="submenu"/>
                                        </f:for>
                                    </ul>
                                </f:if>
                            </f:then>
                            <f:else>
                                <f:render partial="Navigation/NavMenuLink" arguments="{item: mainItem, current: mainItem.current, linkClass: 'first-child dropdown-item{f:if(condition:mainItem.active, then:\' act\')}{f:if(condition:mainItem.current, then:\' current\')}{f:if(condition:mainItem.hasSubpages, then:\' hassub\')}'}" />
                            </f:else>
                        </f:if>
                    </li>
                </f:for>
            </ul>
        </div>
    </div>
</f:if>

<f:section name="submenu">
    <f:if condition="{mainChild.children}">
        <f:then>
            <li
                {f:if(condition:
            '{mainChild.data.doktype} == 4', then:' class="shortcut"')}>
            <button aria-controls="menu-{mainChild.data.uid}" aria-expanded="false" class="sub collapsed dropdown-item dropdown-item-btn{f:if(condition:mainChild.active, then:' act')}{f:if(condition:mainChild.current, then:' current')}{f:if(condition:mainChild.hasSubpages, then:' hassub')}" data-bs-target="#menu-{mainChild.data.uid}" data-bs-toggle="collapse" type="button" title="{f:translate(key: 'header.submenuOpen', extensionName: 'mp_core')}">{mainChild.title}</button>
            <ul class="list-unstyled collapse" id="menu-{mainChild.data.uid}">
                <f:for as="mainChild" each="{mainChild.children}">
                    <f:render arguments="{mainChild: mainChild}" section="submenu"/>
                </f:for>
            </ul>
            </li>
        </f:then>
        <f:else>
            <li
                {f:if(condition:
            '{mainChild.data.doktype} == 4', then:' class="shortcut"')}>
            <f:render partial="Navigation/NavMenuLink" arguments="{item: mainChild, current: mainChild.current, linkClass: 'sub dropdown-item{f:if(condition:mainChild.active, then:\' act\')}{f:if(condition:mainChild.current, then:\' current\')}{f:if(condition:mainChild.hasSubpages, then:\' hassub\')}'}" />
            </li>
        </f:else>
    </f:if>
</f:section>
</html>
