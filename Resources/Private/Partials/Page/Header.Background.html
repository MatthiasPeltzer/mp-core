<html data-namespace-typo3-fluid="true" lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:mpc="http://typo3.org/ns/Mpc/MpCore/ViewHelpers"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

    <div class="header-bg-svg">
        <f:if condition="{filesbg.0}">
            <f:then>
                <mpc:svgInline image="{filesbg.0}" width="16" height="16" class="bg-svg" viewBox="0 0 16 16" additionalAttributes="{aria-hidden:'true'}"/>
            </f:then>
            <f:else>
                <f:render partial="Header.LogoImage" arguments="{logoFile: logoBig, preferSvg: logoSvgBig, imageClass: 'bg-svg', maxHeight: 920}"/>
            </f:else>
        </f:if>
    </div>
</html>
