<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<div class="dialog-header">
    <div class="container">
        <div class="dialog-chrome d-flex align-items-center justify-content-between gap-2 rounded-pill py-1 px-3">
            <div class="flex-grow-1 min-w-0">
                <f:if condition="{headingLevel} == 2">
                    <f:then>
                        <f:if condition="{labelId}">
                            <f:then>
                                <h2 class="dialog-title h3 mb-0 text-truncate" id="{labelId}">{title}</h2>
                            </f:then>
                            <f:else>
                                <h2 class="dialog-title h3 mb-0 text-truncate">{title}</h2>
                            </f:else>
                        </f:if>
                    </f:then>
                    <f:else>
                        <f:if condition="{labelId}">
                            <f:then>
                                <h3 class="dialog-title h3 mb-0 text-truncate" id="{labelId}">{title}</h3>
                            </f:then>
                            <f:else>
                                <h3 class="dialog-title h3 mb-0 text-truncate">{title}</h3>
                            </f:else>
                        </f:if>
                    </f:else>
                </f:if>
            </div>
            <div class="flex-shrink-0">
                <button class="btn-close" data-bs-dismiss="dialog" title="{closeLabel}" type="button">
                    <span class="visually-hidden">{closeLabel}</span>
                </button>
            </div>
        </div>
    </div>
</div>

</html>
