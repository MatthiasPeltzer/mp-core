<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<dialog
    aria-labelledby="{labelId}"
    class="dialog dialog-{size} dialog-scrollable"
    data-bs-backdrop="static"
    id="{modalId}"
>
    <div class="dialog-header">
        <div class="container">
            <div class="row g-0">
                <div class="col-10 title">
                    <f:if condition="{title}">
                        <h2 class="dialog-title h3" id="{labelId}">{title}</h2>
                    </f:if>
                </div>
                <div class="col-2 close text-end">
                    <button class="btn-close" data-bs-dismiss="dialog" title="{closeLabel}" type="button">
                        <span class="visually-hidden">{closeLabel}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="dialog-body" data-modal-content-root>
        {bodyContent -> f:format.raw()}
    </div>
</dialog>

</html>
