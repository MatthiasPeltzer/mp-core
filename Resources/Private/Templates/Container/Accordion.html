<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:mpc="http://typo3.org/ns/Mpc/MpCore/ViewHelpers">

<f:layout name="Container"/>

<f:section name="Main">
    <f:if condition="{data.container_accordion_type} == 1">
        <f:then>
            <f:render arguments="{_all}" section="AccordionBootstrap"/>
        </f:then>
        <f:else>
            <f:render arguments="{_all}" section="AccordionDetails"/>
        </f:else>
    </f:if>
    <f:if condition="{data.container_accordion_faq_schema} && {children_101}">
        <script type="application/ld+json" nonce="{f:security.nonce()}">
            <f:format.raw><mpc:schema.faqPageJsonLd items="{children_101}" /></f:format.raw>
        </script>
    </f:if>
</f:section>

<f:section name="AccordionBootstrap">
    <div class="accordion-wrapper">
        <ul class="accordion list-unstyled" id="accordion-{data.uid}">
            <f:for each="{children_101}" as="record" iteration="iterator">
                <li>
                    <details
                        class="accordion-item"
                        id="heading-{record.uid}"
                        {f:if(condition: '{data.container_accordion_toggle_all} != 1', then: ' name="accordion-{data.uid}"')}
                        {f:if(condition: '{data.container_accordion_toggle} == 1 && {iterator.cycle} == {data.container_accordion_open}', then: ' open')}
                    >
                        <summary class="accordion-header" aria-controls="panel-{record.uid}">
                            <f:if condition="{data.container_headline} == 2"><span class="h2 mb-0">{record.header}</span></f:if>
                            <f:if condition="{data.container_headline} == 3"><span class="h3 mb-0">{record.header}</span></f:if>
                            <f:if condition="{data.container_headline} == 4"><span class="h4 mb-0">{record.header}</span></f:if>
                            <f:if condition="{data.container_headline} == 5"><span class="h5 mb-0">{record.header}</span></f:if>
                            <f:if condition="{data.container_headline} == 6"><span class="h6 mb-0">{record.header}</span></f:if>
                            <f:if condition="{data.container_headline} <= 1"><span>{record.header}</span></f:if>
                            <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 5 6 6 6-6"/></svg>
                        </summary>
                        <div class="accordion-body" id="panel-{record.uid}">
                            <f:format.raw>{record.renderedContent}</f:format.raw>
                        </div>
                    </details>
                </li>
            </f:for>
        </ul>
    </div>
</f:section>

<f:section name="AccordionDetails">
    <section class="details" id="details-{data.uid}" aria-label="{data.header}">
        <ul class="list-unstyled">
            <f:for as="record" each="{children_101}" iteration="iterator">
                <li>
                    <details class="details-item"{f:if(condition:'{data.container_accordion_toggle} == 1 && {iterator.cycle} == {data.container_accordion_open}', then: ' open')}{f:if(condition:'{data.container_accordion_toggle_all} == 0', then:' name="details-item-{data.uid}"')}>
                        <summary>{record.header}</summary>
                        <f:format.raw>{record.renderedContent}</f:format.raw>
                    </details>
                </li>
            </f:for>
        </ul>
    </section>
</f:section>

</html>
